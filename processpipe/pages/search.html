<!DOCTYPE html>
<html lang="en">
<head>
  <title>Search Products | Process Pipe</title>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="../style.css" rel="stylesheet" type="text/css">
  <style>
    .search-wrap{padding:2rem 0}
    .search-bar{display:flex; gap:.75rem; flex-wrap:wrap}
    .search-bar input{flex:1; min-width:240px; padding:.8rem 1rem; border-radius:12px; border:1px solid #ddd}
    .search-bar button{padding:.8rem 1rem; border-radius:12px; border:0; cursor:pointer}
    .results{margin-top:1.25rem; display:grid; gap:.75rem}
    .card{border:1px solid #eee; border-radius:14px; padding:1rem; background:#fff}
    .meta{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.35rem; opacity:.85}
    .pill{font-size:.85rem; padding:.15rem .5rem; border-radius:999px; border:1px solid #eee}
    .row{display:flex; align-items:flex-start; justify-content:space-between; gap:1rem}
    .small{font-size:.9rem; opacity:.8}
    .empty{padding:1rem; border:1px dashed #ddd; border-radius:14px}
  </style>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="../index.html" class="site-logo">Process Pipe</a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
      <nav class="primary-nav" role="navigation" aria-label="Main navigation">
        <ul class="nav-list" id="nav-list">
          <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
          <li class="nav-item"><a href="pages.html" class="nav-link">Products</a></li>
          <li class="nav-item"><a href="search.html" class="nav-link">Search</a></li>
          <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container search-wrap">
    <h1>Search the catalogue</h1>
    <p class="small">Try: <b>"SANS 62 50mm"</b>, <b>"ASTM A106 4 inch sch 40"</b>, <b>"galvanised 20"</b>, <b>"SANS 719 8 inch"</b></p>

    <div class="search-bar">
      <input id="q" type="search" placeholder="Search pipes, sizes, standards…" autocomplete="off" />
      <button id="btn">Search</button>
    </div>

    <div id="status" class="small" style="margin-top:.5rem;"></div>
    <div id="results" class="results"></div>
  </main>

  <script src="../script.js"></script>
  <script>
    // --- Data sources: the old ../api/search.php + ../api/product.php backend has
    // been replaced by these static per-type JSON files under data/pipes/.
    const DATA_FILES = [
      "../data/pipes/sans62.json",
      "../data/pipes/sans719.json",
      "../data/pipes/seamless.json",
      "../data/pipes/galvinsed.json"
    ];

    const qEl = document.getElementById('q');
    const btn = document.getElementById('btn');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');

    let ALL_ITEMS = [];   // merged dataset from every JSON file, loaded once
    let loadError = null;

    async function loadAllData() {
      statusEl.textContent = "Loading catalogue…";
      try {
        const responses = await Promise.all(
          DATA_FILES.map(url => fetch(url, { cache: "no-store" }))
        );

        const missing = responses.filter(r => !r.ok);
        if (missing.length) {
          throw new Error(
            "Could not load: " + missing.map(r => r.url).join(", ")
          );
        }

        const datasets = await Promise.all(responses.map(r => r.json()));
        ALL_ITEMS = datasets.flat();

        statusEl.textContent = `Loaded ${ALL_ITEMS.length} item(s).`;
      } catch (err) {
        loadError = err;
        statusEl.textContent = "Error loading catalogue data: " + err.message;
        console.error(err);
      }
    }

    function normalize(str) {
      return String(str ?? "").toLowerCase();
    }

    // Splits the query into tokens and requires every token to appear
    // somewhere in the item's searchable text (keywords + key fields).
    function matchesQuery(item, query) {
      if (!query) return true;
      const tokens = normalize(query).split(/\s+/).filter(Boolean);
      const haystack = normalize([
        item.keywords,
        item.description,
        item.category,
        item.standard,
        item.grade,
        item.schedule,
        item.nps,
        item.nominal_bore,
        item.outside_diameter
      ].filter(Boolean).join(" "));

      return tokens.every(tok => haystack.includes(tok));
    }

    function runSearch() {
      if (loadError) {
        statusEl.textContent = "Error: " + loadError.message;
        return;
      }

      const q = qEl.value.trim();
      resultsEl.innerHTML = "";

      const results = ALL_ITEMS.filter(item => matchesQuery(item, q));

      statusEl.textContent = q
        ? `${results.length} result(s) for "${q}"`
        : `${results.length} item(s) — showing full catalogue`;

      if (results.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No matches. Try different words (e.g. "sch 40", "A106", "galvanised", "DN 50").</div>`;
        return;
      }

      // cap initial render for very broad/empty queries so the page stays snappy
      const LIMIT = 60;
      const shown = results.slice(0, LIMIT);
      if (results.length > LIMIT) {
        const note = document.createElement('div');
        note.className = "small";
        note.textContent = `Showing first ${LIMIT} of ${results.length} — refine your search to narrow this down.`;
        resultsEl.appendChild(note);
      }

      for (const r of shown) {
        const div = document.createElement('div');
        div.className = "card";
        const title = r.description
          ? `${r.description}${r.nps ? " — " + r.nps : ""}`
          : (r.sku || `Item ${r.id}`);

        div.innerHTML = `
          <div class="row">
            <div>
              <div style="font-weight:700">${escapeHtml(title)}</div>
              <div class="small">${escapeHtml(r.standard || "")}</div>
              <div class="meta">
                ${r.category ? `<span class="pill">${escapeHtml(r.category)}</span>` : ""}
                ${r.standard ? `<span class="pill">${escapeHtml(r.standard)}</span>` : ""}
                ${r.grade ? `<span class="pill">${escapeHtml(r.grade)}</span>` : ""}
                ${r.schedule ? `<span class="pill">${escapeHtml(r.schedule)}</span>` : ""}
                ${r.nominal_bore ? `<span class="pill">NB ${escapeHtml(r.nominal_bore)}</span>` : ""}
              </div>
            </div>
            <button data-id="${r.id}" style="padding:.6rem .8rem;border-radius:12px;border:1px solid #eee;background:#fff;cursor:pointer">
              Details
            </button>
          </div>
        `;
        div.querySelector('button').addEventListener('click', () => {
          window.location.href = `pipe-product.html?id=${encodeURIComponent(r.id)}`;
        });
        resultsEl.appendChild(div);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    btn.addEventListener('click', runSearch);
    qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

    // auto-run if ?q= is provided
    const params = new URLSearchParams(location.search);
    if (params.get('q')) qEl.value = params.get('q');

    loadAllData().then(runSearch);
  </script>
</body>
</html>

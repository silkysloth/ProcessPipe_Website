<!DOCTYPE html>
<html lang="en">
<head>
  <title>Product Detail — Process Pipe</title>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="style3.css" rel="stylesheet" type="text/css">
  <style>
    body.product-page { background: #f5f7fa !important; }

    /* ── BACK BAR ───────────────────────────────────────────── */
    .back-bar {
      background: #fff;
      border-bottom: 1.5px solid #e2e8f0;
      padding: 1.5rem 0;
    }
    .back-bar .container {
      background: transparent !important;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #0a74da;
      text-decoration: none;
      padding: 6px 14px;
      border: 1.5px solid #c8d8ee;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: #0a74da; color: #fff; border-color: #0a74da; }

    .breadcrumb {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .breadcrumb-prefix {
      font-size: 0.82rem;
      color: #999;
      white-space: nowrap;
    }
    .breadcrumb-heading {
      font-size: 1rem;
      font-weight: 700;
      color: #1a2b3c;
      margin: 0;
    }

    /* ── PRODUCT DETAIL CARD ────────────────────────────────── */
    .product-detail-wrap {
      max-width: 720px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }

    .detail-card {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .detail-header {
      background: linear-gradient(135deg, #0a74da 0%, #0559a8 100%);
      padding: 1.75rem 2rem;
      color: #fff;
    }
    .detail-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .detail-chip {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
      letter-spacing: 0.03em;
    }
    .detail-title {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
      margin: 0 0 0.25rem;
      line-height: 1.2;
    }
    .detail-subtitle {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .detail-body { padding: 1.75rem 2rem; }

    /* Spec grid */
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .spec-box {
      background: #f4f7fb;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .spec-box-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 0.35rem;
    }
    .spec-box-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0d1c2e;
      word-break: break-word;
    }
    .spec-box-unit {
      font-size: 0.75rem;
      font-weight: 500;
      color: #667;
      margin-left: 2px;
    }

    /* Info table */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .info-table tr {
      border-bottom: 1px solid #e8edf3;
    }
    .info-table tr:last-child { border-bottom: none; }
    .info-table td {
      padding: 0.7rem 0.5rem;
      vertical-align: top;
    }
    .info-table td:first-child {
      color: #777;
      font-weight: 600;
      width: 45%;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding-top: 0.8rem;
    }
    .info-table td:last-child {
      color: #0d1c2e;
      font-weight: 500;
    }

    /* Enquire CTA */
    .detail-footer {
      padding: 1.25rem 2rem 1.75rem;
      border-top: 1.5px solid #e8edf3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .enquire-note {
      font-size: 0.82rem;
      color: #777;
    }
    .enquire-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0a74da;
      color: #fff !important;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 22px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .enquire-btn:hover { background: #0859b0; }

    /* Loading / error states */
    .state-msg {
      text-align: center;
      padding: 4rem 2rem;
      color: #777;
      font-size: 1rem;
    }
    .state-msg strong { display: block; font-size: 1.2rem; color: #334; margin-bottom: 0.5rem; }

    @media (max-width: 600px) {
      .detail-header { padding: 1.25rem 1.25rem; }
      .detail-body   { padding: 1.25rem 1.25rem; }
      .detail-footer { padding: 1rem 1.25rem 1.5rem; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body class="product-page">

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="../index.html" class="site-logo">
        <img src="../images/processpipelogo.png" alt="Process Pipe Logo" class="logo-image">Process Pipe
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
      <nav class="primary-nav" role="navigation" aria-label="Main navigation">
        <ul class="nav-list" id="nav-list">
          <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
          <li class="nav-item dropdown">
            <a href="pages.html" class="nav-link dropdown-toggle">Pages ▾</a>
            <ul class="dropdown-menu">
              <li><a href="pipes.html">Pipes</a></li>
              <li><a href="flanges.html">Flanges</a></li>
              <li><a href="fittings.html">Fittings</a></li>
            </ul>
          </li>
          <li class="nav-item"><a href="contact.html" class="nav-link">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ── BACK BAR ─────────────────────────────────────────── -->
  <div class="back-bar">
    <div class="container">
      <button class="back-btn" id="back-btn">← Back to Pipes</button>
      <div class="breadcrumb">
        <span class="breadcrumb-prefix">Pipes ›</span>
        <h1 class="breadcrumb-heading" id="breadcrumb-label">Product Detail</h1>
      </div>
    </div>
  </div>

  <!-- ── MAIN ──────────────────────────────────────────────── -->
  <main>
    <div class="product-detail-wrap">
      <div class="detail-card" id="detail-card">
        <div class="state-msg" id="loading-msg">
          <strong>Loading product...</strong>
          Fetching specification data.
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-contact"><p>&copy; Process Pipe</p></div>
      <div class="footer-quicklinks">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="pages.html">Pages</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="script2.js" defer></script>

  <script>
  document.addEventListener("DOMContentLoaded", async () => {

    // ── Back button ────────────────────────────────────────────
    const backBtn = document.getElementById("back-btn");
    backBtn.addEventListener("click", () => {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        history.back();
      } else {
        window.location.href = "pipes.html";
      }
    });

    // ── Get ID from URL ────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));

    if (!id && id !== 0) {
      showError("No product ID specified.");
      return;
    }

    // ── Load all data files ────────────────────────────────────
    const DATA_FILES = [
      "../data/pipes/seamless.json",
      "../data/pipes/sans62.json",
      "../data/pipes/sans719.json",
      "../data/pipes/galvinsed.json",
    ];

    let product = null;

    for (const file of DATA_FILES) {
      try {
        const res = await fetch(file, { cache: "no-cache" });
        if (!res.ok) continue;
        const items = await res.json();
        const found = items.find(p => p.id === id);
        if (found) { product = found; break; }
      } catch(e) {
        console.warn("Could not load", file, e);
      }
    }

    if (!product) {
      showError("Product not found.");
      return;
    }

    // ── Render ─────────────────────────────────────────────────
    renderProduct(product);

    function renderProduct(p) {
      const desc     = p.description || "Product";
      const standard = p.standard    || "—";
      const nps      = p.nps         || "—";
      const nb       = p.nominal_bore || p["nominal bore"] || "—";
      const od       = p.outside_diameter || p["outside diameter"] || "—";
      const schedule = p.schedule    || "—";
      const grade    = p.grade       || null;
      const wall     = p.wall_thickness_mm || "—";
      const mass     = p.mass_kg_per_m || "—";
      const category = p.category    || "Pipe";

      // Update breadcrumb
      document.title = `${desc} ${nps} ${schedule} — Process Pipe`;
      document.getElementById("breadcrumb-label").textContent = `${desc} — ${nps}`;

      // Pipe type chip
      const d = (desc + " " + (schedule || "")).toLowerCase();
      const typeChip =
        d.includes("seamless") ? "Seamless" :
        d.includes("galvan")   ? "Galvanised" :
        d.includes("weld")     ? "Welded" : category;

      document.getElementById("detail-card").innerHTML = `
        <div class="detail-header">
          <div class="detail-chips">
            <span class="detail-chip">${standard}</span>
            <span class="detail-chip">${typeChip}</span>
          </div>
          <div class="detail-title">${desc} — ${nps}</div>
          <div class="detail-subtitle">${grade ? grade + " Grade" : schedule}</div>
        </div>

        <div class="detail-body">
          <div class="spec-grid">
            <div class="spec-box">
              <div class="spec-box-label">Nominal Bore</div>
              <div class="spec-box-value">${nb}<span class="spec-box-unit">mm</span></div>
            </div>
            <div class="spec-box">
              <div class="spec-box-label">Outside Diameter</div>
              <div class="spec-box-value">${od}<span class="spec-box-unit">mm</span></div>
            </div>
            <div class="spec-box">
              <div class="spec-box-label">Nominal Pipe Size</div>
              <div class="spec-box-value">${nps}</div>
            </div>
            <div class="spec-box">
              <div class="spec-box-label">Wall Thickness</div>
              <div class="spec-box-value">${wall}<span class="spec-box-unit">mm</span></div>
            </div>
            <div class="spec-box">
              <div class="spec-box-label">Mass</div>
              <div class="spec-box-value">${mass}<span class="spec-box-unit">kg/m</span></div>
            </div>
          </div>

          <table class="info-table">
            <tr><td>Standard</td><td>${standard}</td></tr>
            ${p.grade ? `<tr><td>Grade</td><td>${p.grade}</td></tr>` : `<tr><td>Schedule</td><td>${schedule}</td></tr>`}
            <tr><td>Category</td><td>${category}</td></tr>
            <tr><td>Wall Thickness</td><td>${wall} mm</td></tr>
            <tr><td>Mass</td><td>${mass} kg/m</td></tr>
            <tr><td>Standard Length</td><td>${p.standard_length_m ? p.standard_length_m + " m" : "—"}</td></tr>
            ${p.wp_water_kpa ? `<tr><td>Max Working Pressure (Water)</td><td>${p.wp_water_kpa} kPa</td></tr>` : ""}
            ${p.wp_steam_kpa ? `<tr><td>Max Working Pressure (Steam/Air/Gas)</td><td>${p.wp_steam_kpa} kPa</td></tr>` : ""}
          </table>
        </div>

        <div class="detail-footer">
          <p class="enquire-note">Interested in this product? Contact us for pricing and availability.</p>
          <a href="contact.html" class="enquire-btn">✉ Enquire Now</a>
        </div>
      `;
    }

    function showError(msg) {
      document.getElementById("detail-card").innerHTML = `
        <div class="state-msg">
          <strong>Product not found</strong>
          ${msg} <br><br>
          <a href="pipes.html" style="color:#0a74da;font-weight:600;">← Back to Pipes</a>
        </div>`;
    }

  });
  </script>

</body>
</html>
